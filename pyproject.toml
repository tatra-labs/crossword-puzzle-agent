[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crossword-puzzle-agent"
version = "0.1.0"
description = "An AI agent that solves crossword puzzles by combining an LLM clue reader with belief propagation and constrained search over the grid."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "crossword-puzzle-agent" }]
keywords = ["crossword", "agent", "llm", "constraint-satisfaction", "belief-propagation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.40",
    "numpy>=1.26",
    "scipy>=1.11",
    "rich>=13.0",
    "typer>=0.12",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
xword = "xword.cli:app"

[project.urls]
Homepage = "https://github.com/tatra-labs/crossword-puzzle-agent"
Repository = "https://github.com/tatra-labs/crossword-puzzle-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xword = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

# pytest is configured in pytest.ini, which takes precedence over this file.
# Keeping the settings in one place stops the two copies drifting apart.
