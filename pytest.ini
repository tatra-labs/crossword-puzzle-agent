[pytest]
# `src` layout: the package is importable without an editable install, which
# keeps a bare `python -m pytest` working in a fresh checkout.
pythonpath = src
testpaths = tests

# In pytest >= 9 these are ini options. Passing --strict-markers through
# addopts does NOT work: the flag is an ini override, and overrides coming
# from addopts are applied after the marker check has already run.
strict_markers = true
strict_config = true

# Live tests spend real money against the Anthropic API, so they are opt-in:
# run them with an explicit `-m live`, which overrides this default.
addopts = -m "not live"

markers =
    slow: takes more than a second or two; deselect with -m "not slow"
    live: calls the real Anthropic API (costs money, needs a key); deselected by default
